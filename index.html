<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A4DFF">
<title>Antrenman Çizelgem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#E4E9F2; --ink:#121826; --muted:#5B6578;
  --line:#D5DBE7; --accent:#3A4DFF; --on-accent:#FFFFFF; --done:#1F9D6B; --danger:#D6334A;
  --head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1420; --surface:#1A2133; --surface2:#242D44; --ink:#EAEFFA; --muted:#97A3BC;
    --line:#2B3550; --accent:#7C8CFF; --on-accent:#0F1420; --done:#4CD39A; --danger:#FF6B80;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1420; --surface:#1A2133; --surface2:#242D44; --ink:#EAEFFA; --muted:#97A3BC;
  --line:#2B3550; --accent:#7C8CFF; --on-accent:#0F1420; --done:#4CD39A; --danger:#FF6B80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:520px;margin:0 auto;padding:16px 16px 40px}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 2px 14px}
.tools{display:flex;gap:8px;flex:none}
.tools .ib{width:42px;height:42px;background:var(--surface);border:1px solid var(--line)}
.top h1{font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0}
.top .date{color:var(--muted);font-size:14px;margin-top:2px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dbtn{position:relative;padding:10px 0 9px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--head);font-weight:600;font-size:17px;letter-spacing:.03em}
.dbtn .cnt{font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);min-height:14px;line-height:14px}
.dbtn.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dbtn.sel .cnt{color:var(--on-accent);opacity:.85}
.dbtn.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dbtn.sel.today::after{background:var(--on-accent)}

.dayhead{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.dayhead h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1;margin:0}
.dayhead .sub{color:var(--muted);font-size:14px;margin-top:4px}
.plus{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(58,77,255,.35);flex:none}
.plus svg{width:28px;height:28px}
.plus:active{transform:scale(.94)}

.list{display:flex;flex-direction:column;gap:10px}
.ex{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 4px;position:relative}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk svg{width:16px;height:16px}
.ex.done .chk{background:var(--done);border-color:var(--done);color:#fff}
.ex .info{flex:1;min-width:0;text-align:left}
.ex .edit{display:block;width:100%;text-align:left;padding:2px 0}
.ex .name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.ex .meta{color:var(--muted);font-size:14px;margin-top:2px}
.ex .kg{font-family:var(--head);font-weight:700;font-size:24px;white-space:nowrap}
.ex .kg small{font-size:14px;color:var(--muted);margin-left:2px;font-family:var(--body);font-weight:500}
.ex.done .name{text-decoration:line-through;color:var(--muted)}
.qm{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:18px;
  display:grid;place-items:center;flex:none;line-height:1}
.qm:active{background:var(--accent);color:var(--on-accent)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.addrow{margin-top:12px;width:100%;padding:14px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-weight:600}
.addrow:active{background:var(--surface2)}
.clear{display:block;margin:18px auto 0;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}

.ov{position:fixed;inset:0;background:rgba(8,12,24,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:90%;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 8px}
.sh-head h3{font-family:var(--head);font-size:24px;font-weight:700;margin:0;overflow-wrap:anywhere}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:none}
.ib svg{width:20px;height:20px}
.sh-body{overflow-y:auto;padding:4px 16px 18px}
.search{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--on-accent)}
.pick{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:17px}
.pick span{color:var(--muted);font-size:13px;margin-left:8px}
.pick.new{color:var(--accent);font-weight:600}
.nores{color:var(--muted);padding:14px 4px}
.count{color:var(--muted);font-size:13px;margin:0 0 4px 2px}

.field{margin:14px 0}
.field label{display:block;font-weight:600;margin-bottom:8px}
.stp{display:flex;align-items:center;gap:10px}
.stp button{width:52px;height:52px;border-radius:14px;background:var(--surface2);font-size:26px;font-weight:600;flex:none}
.stp button:active{background:var(--line)}
.stp input{flex:1;min-width:0;height:52px;text-align:center;font-family:var(--head);font-weight:700;font-size:30px;border-radius:14px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.last{color:var(--muted);font-size:13px;margin-top:6px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn{padding:15px;border-radius:14px;font-weight:600;font-size:17px;text-align:center}
a.btn{display:block;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.del{color:var(--danger);background:none}

/* Hareket bilgi paneli */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.tag{padding:5px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600}
.diagram{background:var(--bg);border-radius:16px;padding:12px 8px 6px;margin-bottom:12px}
.diagram svg{display:block;width:100%;max-width:300px;margin:0 auto}
.sil{fill:var(--surface2);stroke:var(--line);stroke-width:1.2}
.mp *{fill:var(--accent)}
.ms *{fill:var(--accent);opacity:.4}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin:0 2px 14px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:baseline}
.dot.s{opacity:.4}
.steps{margin:0 0 14px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);line-height:1.4}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.tip{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4;margin-bottom:6px}
.tip b{display:block;margin-bottom:2px}
.note{color:var(--muted);font-size:13px;margin:8px 2px 0;line-height:1.4}

.grip{width:26px;height:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grip svg{width:16px;height:16px}
.ex.shift{transition:transform .16s ease}
.ex.dragging{z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.28);transition:none;border-color:var(--accent)}
.hist{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 11px 4px 8px;border-radius:99px;background:var(--surface2);color:var(--accent);font-size:13px;font-weight:600}
.hist svg{width:14px;height:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.stat{background:var(--bg);border-radius:12px;padding:10px 10px 9px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.stat b{font-family:var(--head);font-size:22px;font-weight:700;line-height:1.1}
.stat b.up{color:var(--done)}
.stat b.down{color:var(--danger)}
.chartbox{background:var(--bg);border-radius:16px;padding:10px 6px 4px;margin-bottom:6px}
.chartbox svg{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--accent);opacity:.13}
.pt{fill:var(--bg);stroke:var(--accent);stroke-width:2.5}
.pt.last{fill:var(--accent)}
.ax{fill:var(--muted);font-size:10px}
.vl{fill:var(--ink);font-size:11px;font-weight:700}
.hh{font-family:var(--head);font-size:20px;font-weight:700;margin:16px 2px 2px}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.hrow .hd{flex:1}
.hrow .hd small{display:block;color:var(--muted);font-size:13px}
.hrow .hv{font-family:var(--head);font-weight:700;font-size:20px}
.hx{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.hx svg{width:16px;height:16px}
.ta{width:100%;min-height:150px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.linkbtn{display:block;margin:22px auto 0;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.calhead b{font-family:var(--head);font-size:24px;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cd{aspect-ratio:1/1;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:15px}
.cd.t{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.s{background:var(--accent);color:var(--on-accent)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.w{background:var(--done)}
.dots i.p{background:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.cd.s .dots i{background:var(--on-accent)}
.cd.s .dots i.p{background:none;box-shadow:inset 0 0 0 1.5px var(--on-accent)}
.cd.s .dots i.w{background:var(--on-accent);opacity:.55}
.inl{display:flex;gap:10px;align-items:center}
.inl input{flex:1;min-width:0;height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--head);font-weight:700;font-size:22px}
.inl .btn{height:52px;padding:0 20px;display:grid;place-items:center}
.grow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.grow .hd{flex:1;min-width:0}
.grow .hd small{display:block;color:var(--muted);font-size:13px}
.grow .hd b{overflow-wrap:anywhere}
.grow .rt{text-align:right;flex:none}
.grow .hv{font-family:var(--head);font-weight:700;font-size:18px;white-space:nowrap}
.badge{display:inline-block;margin-top:3px;font-family:var(--head);font-weight:700;font-size:16px;padding:1px 10px;border-radius:99px;background:var(--surface2)}
.badge.up{color:var(--done)}
.badge.down{color:var(--danger)}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.weeknav .ib{width:36px;height:36px}
.weeknav .ib svg{width:18px;height:18px}
.wmid{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.wtoday{padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600}
.gsp{width:26px;height:44px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-weight:600;font-size:15px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ===== v8: profesyonel ana ekran ===== */
:root{--water:#2A9DF4;--kcal:#F2762E;--navh:calc(66px + env(safe-area-inset-bottom,0px))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--water:#5CB8FF;--kcal:#FF9A5C}}
:root[data-theme="dark"]{--water:#5CB8FF;--kcal:#FF9A5C}
.app{padding:12px 16px calc(var(--navh) + 28px)}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 2px 14px}
.eyebrow{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.hdr h1{font-family:var(--head);font-size:34px;font-weight:700;line-height:1.05;margin:2px 0 0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 1px 2px rgba(18,24,38,.05)}
.card h4{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.kbig{font-family:var(--head);font-size:30px;font-weight:700;line-height:1}
.kbig small{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:500;margin-left:3px}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 7px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--kcal);transition:width .4s ease}
.cap{font-size:12px;color:var(--muted)}
.wrow{display:flex;gap:10px;align-items:center}
.glass{width:34px;height:46px;flex:none;color:var(--muted)}
.wbtns{display:flex;gap:6px;margin-top:9px;align-items:center}
.wbtn{flex:1;padding:8px 6px;border-radius:12px;background:var(--water);color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
:root[data-theme="dark"] .wbtn{color:#0F1420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wbtn{color:#0F1420}}
.wmin{width:34px;height:34px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.wmin svg{width:16px;height:16px}
.ex{border-radius:16px;box-shadow:0 1px 2px rgba(18,24,38,.05)}
.ex .kg.sm{font-size:18px;max-width:92px;text-align:right}
.chk.play{border-color:var(--accent);color:var(--accent)}
.chk.play svg,.chk.run svg{width:14px;height:14px;margin-left:2px}
.chk.run{border-color:var(--kcal);color:var(--kcal);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.chk.run{animation:none}}
.tbar{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:10px 12px;margin:0 0 12px;box-shadow:0 6px 18px rgba(58,77,255,.3)}
.tbar .ti{flex:1;min-width:0}
.tbar small{display:block;font-size:11px;opacity:.85}
.tbar b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .tt{font-family:var(--head);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.tbar button{background:rgba(255,255,255,.22);color:inherit;border-radius:10px;padding:8px 10px;font-weight:600;font-size:13px}
.tbar button.tx{padding:8px;display:grid;place-items:center}
.tbar button.tx svg{width:16px;height:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:11px 4px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.est{margin:-2px 2px 8px;color:var(--muted);font-size:14px;line-height:1.4}
.est b{color:var(--kcal)}
.est span{font-size:12px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px env(safe-area-inset-bottom,0px)}
.nav .in{display:flex;max-width:520px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent)}
.ov{inset:0 0 var(--navh) 0;z-index:20}
.sheet{padding-bottom:0}
.toast{bottom:calc(var(--navh) + 14px)}
.hrow .hd b{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">
  <div id="timerbar" class="tbar" style="display:none"></div>
  <div class="hdr">
    <div><div class="eyebrow" id="eyebrow">Antrenman Çizelgem</div><h1 id="today"></h1></div>
    <button class="wtoday" id="wtoday" data-today="1">Bugün</button>
  </div>
  <div class="weeknav">
    <button class="ib" data-wk="-1" aria-label="Önceki hafta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="wmid"><span id="wlabel"></span></div>
    <button class="ib" data-wk="1" aria-label="Sonraki hafta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="week" id="week"></div>

  <div class="cards">
    <div class="card">
      <h4>Yakılan kalori</h4>
      <div class="kbig" id="kval"></div>
      <div class="bar"><i id="kbar"></i></div>
      <div class="cap" id="kcap"></div>
    </div>
    <div class="card">

let AC=null,pendTap=null;
function ac(){
  if(!S.cfg.sound)return null;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return null;}
  return AC;
}
function tone(f,t0,d,type,vol){
  const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.03);
}

/* kcal = MET x vücut kilosu (kg) x süre (saat). MET: Compendium of Physical Activities. spd: ortalama hız (km/s) */
const CARDIO={
  'Koşu Bandı':{met:8,spd:8},
  'Bisiklet':{met:7,spd:20},
  'Kürek':{met:7,spd:12},
  'Eliptik':{met:5,spd:7},

  'Merdiven Makinesi':{met:9},
  'Burpee':{met:8},
  'Jumping Jack':{met:8},
  'Eğimli Yürüyüş':{met:5.3,spd:5},
  'Battle Rope':{met:8},
  'Box Jump':{met:8}
};
const DEFMET=7;
const isCardio=n=>!!((INFO[n]&&INFO[n].c==='Kardiyo')||S.customCardio.includes(n));
const cmet=n=>(CARDIO[n]&&CARDIO[n].met)||DEFMET;
const cspd=n=>(CARDIO[n]&&CARDIO[n].spd)||0;
const bodyKg=()=>S.bw.length?S.bw[S.bw.length-1].kg:S.cfg.weight;
const kcalMin=n=>cmet(n)*bodyKg()/60;
const CGOAL={time:{u:'dk',step:5,def:30,min:1},dist:{u:'km',step:0.5,def:5,min:0.5},cal:{u:'kcal',step:50,def:300,min:10}};
function cardioCalc(name,mode,goal){
  const km=kcalMin(name),spd=cspd(name);
  if(mode==='time')return{mode,mins:goal,km:0,kcal:Math.round(km*goal)};
  if(mode==='dist'){const mins=spd?goal/spd*60:0;return{mode,mins,km:goal,kcal:Math.round(km*mins)};}
  if(mode==='cal')return{mode,mins:km?goal/km:0,km:0,kcal:Math.round(goal)};
  return{mode:'free',mins:0,km:0,kcal:0};
}

/* ========== Kayıtlar ========== */
function logAt(name,t,kg,sets,reps){
  const a=S.log[name]||(S.log[name]=[]);
  const en={d:t,kg:+kg||0,sets:+sets||1,reps:+reps||1};
  const i=a.findIndex(x=>x.d===t);if(i>-1)a[i]=en;else a.push(en);
  a.sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:0);
}
function logCardio(name,t,en,add){
  const a=S.log[name]||(S.log[name]=[]);
  const i=a.findIndex(x=>x.d===t);
  if(add&&i>-1&&a[i].c){
    a[i].mins=r1(a[i].mins+en.mins);a[i].kcal=Math.round(a[i].kcal+en.kcal);a[i].km=r1((a[i].km||0)+(en.km||0));a[i].mode=en.mode;
  }else{
    const x={d:t,c:1,mode:en.mode,mins:r1(en.mins),km:r1(en.km||0),kcal:Math.round(en.kcal)};
    if(i>-1)a[i]=x;else a.push(x);
  }
  a.sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:0);
}
function logUnset(name,d){
  const a=S.log[name];if(!a)return;const i=a.findIndex(x=>x.d===d);if(i>-1)a.splice(i,1);
}
const logOn=(name,D)=>(S.log[name]||[]).find(x=>x.d===D);
const kcalDay=D=>{let t=0;for(const n in S.log){const l=S.log[n].find(x=>x.d===D);if(l&&l.c)t+=l.kcal||0;}return t;};
const waterTotal=D=>(S.water[D]||[]).reduce((a,b)=>a+b,0);
function logLine(x){
  if(x.c){
    const val=x.mode==='dist'&&x.km?fmt(x.km)+' km':x.mode==='cal'?Math.round(x.kcal)+' kcal':fmt(r1(x.mins))+' dk';
    return{sub:`${Math.round(x.kcal)} kcal`+(x.mode==='free'?' · sayaç':''),val};
  }
  return{sub:`${x.sets} set × ${x.reps} tekrar`,val:x.kg>0?fmt(x.kg)+' kg':'–'};
}

/* ---------- Çizgi grafik (tarih ölçekli) ---------- */
function chartSvg(pts,range,f){
  f=f||fv;
  const W=320,H=210,L=42,R=16,T=22,B=30,iw=W-L-R,ih=H-T-B;
  const n=pts.length,di=pts.map(p=>dayIdx(p.d));
  let t0,t1;
  if(range&&range!=='all'){t1=Math.max(todayDN(),di[n-1]);t0=t1-(RANGES[range][1]-1);}
  else{t0=di[0];t1=di[n-1];}
  const span=t1-t0;
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);
  let pad=(hi-lo)*0.25;if(!pad)pad=Math.max(1,Math.abs(hi)*0.1);
  lo=Math.max(0,lo-pad);hi=hi+pad;
  const X=t=>span?L+iw*(t-t0)/span:L+iw/2;
  const Y=v=>T+ih*(1-(v-lo)/(hi-lo));
  let g='';
  for(let k=0;k<4;k++){const v=lo+(hi-lo)*k/3,yy=Y(v);
    g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-6}" y="${yy+3.5}" text-anchor="end">${f(v)}</text>`;}
  const tk=[];
  if(span<=0)tk.push(t0);else if(span<=7){for(let t=t0;t<=t1;t++)tk.push(t);}else{for(let k=0;k<5;k++)tk.push(t0+Math.round(span*k/4));}
  const xl=tk.map((t,i)=>`<text class="ax" x="${X(t)}" y="${H-10}" text-anchor="${tk.length>1&&i===0?'start':tk.length>1&&i===tk.length-1?'end':'middle'}">${idxLabel(t)}</text>`).join('');
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(di[i])} ${Y(p.v)}`).join(' ');
  const area=n>1?`<path class="ar" d="${line} L${X(di[n-1])} ${T+ih} L${X(di[0])} ${T+ih} Z"/>`:'';
  const dots=pts.map((p,i)=>`<circle class="pt${i===n-1?' last':''}" cx="${X(di[i])}" cy="${Y(p.v)}" r="${i===n-1?5:3.5}"/>`).join('');
  const lx=X(di[n-1]),ly=Y(pts[n-1].v);
  const lab=`<text class="vl" x="${lx}" y="${ly-10}" text-anchor="${lx>W-44?'end':'middle'}">${f(pts[n-1].v)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Çizgi grafik">${g}${area}${n>1?`<path class="ln" d="${line}"/>`:''}${dots}${lab}${xl}</svg>`;
}


/* ========== Ana ekran ========== */
const MLBL={time:'Süre hedefi',dist:'Mesafe hedefi',cal:'Kalori hedefi',free:'Hedefsiz'};
function dayRows(D){
  const tpl=S.plan[D]||[],rows=[];
  tpl.forEach(e=>{
    const l=logOn(e.name,D);
    if(e.cardio){
      const lc=l&&l.c?l:null;
      const c=lc||cardioCalc(e.name,e.mode,e.goal);
      rows.push({kind:'plan',id:e.id,name:e.name,cardio:true,mode:lc?lc.mode:e.mode,goal:e.goal,done:!!lc,mins:c.mins,km:c.km,kcal:c.kcal});
    }else{
      rows.push({kind:'plan',id:e.id,name:e.name,kg:l?l.kg:e.kg,sets:l?l.sets:e.sets,reps:l?l.reps:e.reps,done:!!l});
    }
  });
  const names=new Set(tpl.map(e=>e.name));
  for(const n in S.log){
    if(names.has(n))continue;
    const l=S.log[n].find(x=>x.d===D);if(!l)continue;
    if(l.c){
      const goal=l.mode==='dist'?l.km:l.mode==='cal'?l.kcal:l.mins;
      rows.push({kind:'extra',id:'x:'+n,name:n,cardio:true,mode:l.mode,goal,done:true,mins:l.mins,km:l.km,kcal:l.kcal});
    }else{
      rows.push({kind:'extra',id:'x:'+n,name:n,kg:l.kg,sets:l.sets,reps:l.reps,done:true});
    }
  }
  return rows;
}
function goalTxt(e){
  if(e.mode==='time')return fmt(e.goal)+' dk';
  if(e.mode==='dist')return fmt(e.goal)+' km';
  if(e.mode==='cal')return fmt(e.goal)+' kcal';
  return 'Hedefsiz';
}
function rowHtml(e){
  const timerOn=S.timer&&S.timer.id===e.id;
  let lead,meta,val;
  if(e.cardio){
    const free=e.mode==='free';
    val=e.done?logLine({c:1,mode:e.mode,km:e.km,mins:e.mins,kcal:e.kcal}).val:goalTxt(e);
    meta=e.done?`Yapıldı · ${Math.round(e.kcal)} kcal`+(free?' · sayaç':'')
      :(free?'Sayaçla süre tutulur':`${MLBL[e.mode]} · ~${Math.round(e.kcal)} kcal`);
    if(e.kind==='extra')lead=`<span class="chk" aria-label="Yapıldı">${IC.ok}</span>`;
    else if(free&&!e.done)lead=timerOn?`<span class="chk run" aria-label="Sayaç çalışıyor">${IC.play}</span>`
      :`<button class="chk play" data-tstart="${esc(e.id)}" aria-label="Sayacı başlat">${IC.play}</button>`;
    else lead=`<button class="chk" data-done="${esc(e.id)}" aria-label="Tamamlandı olarak işaretle">${IC.ok}</button>`;
  }else{
    meta=`${e.sets} set × ${e.reps} tekrar`;
    val=null;
    lead=e.kind==='extra'?`<span class="chk" aria-label="Yapıldı">${IC.ok}</span>`
      :`<button class="chk" data-done="${esc(e.id)}" aria-label="Tamamlandı olarak işaretle">${IC.ok}</button>`;
  }
  if(e.kind==='extra')meta+=' · takvimden eklendi';
  return `
      <div class="ex${e.done?' done':''}${e.cardio?' cardio':''}">
        ${e.kind==='plan'?`<button class="grip" aria-label="Sıralamak için sürükle">${IC.grip}</button>`:'<span class="gsp"></span>'}
        ${lead}

          <button class="edit" data-edit="${esc(e.id)}">
            <div class="name">${esc(e.name)}</div>
            <div class="meta">${meta}</div>
          </button>
          <button class="hist" data-hist="${esc(e.name)}">${IC.chart}İlerleme</button>
        </div>
        <div class="kg${val!==null?' sm':''}">${val!==null?esc(val):(e.kg>0?fmt(e.kg)+'<small>kg</small>':'–')}</div>
        <button class="qm" data-info="${esc(e.name)}" aria-label="${esc(e.name)} nasıl yapılır">?</button>
      </div>`;
}

const tel=()=>S.timer?(S.timer.acc+(S.timer.start?Date.now()-S.timer.start:0)):0;
const mmss=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad2(m):pad2(m))+':'+pad2(x);};
function renderTimer(){
  const b=$('timerbar');
  if(!S.timer){b.innerHTML='';b.style.display='none';return;}
  const run=!!S.timer.start;
  b.style.display='';
  b.innerHTML=`<div class="ti"><small>${run?'Sayaç çalışıyor':'Sayaç duraklatıldı'}</small><b>${esc(S.timer.name)}</b></div><div class="tt" id="tt">${mmss(tel())}</div><button data-tpause="1">${run?'Duraklat':'Devam'}</button><button data-tfinish="1">Bitir</button><button class="tx" data-tcancel="1" aria-label="Sayacı iptal et">${IC.x}</button>`;
}
setInterval(()=>{if(S.timer){const t=$('tt');if(t)t.textContent=mmss(tel());}},500);
function startTimer(id){
  if(S.timer){toast('Önce çalışan sayacı bitir');return;}
  const e=planList(viewDate).find(x=>x.id===id);if(!e)return;
  S.timer={id:e.id,name:e.name,date:viewDate,acc:0,start:Date.now()};
  save();render();sfx('add');
}
function pauseTimer(){
  if(!S.timer)return;
  if(S.timer.start){S.timer.acc+=Date.now()-S.timer.start;S.timer.start=null;}else S.timer.start=Date.now();
  save();renderTimer();
}
function finishTimer(){
  const t=S.timer;if(!t)return;
  const mins=tel()/60000;
  S.timer=null;
  if(mins<0.1){save();render();toast('Süre çok kısa, kaydedilmedi');return;}
  const en={mode:'free',mins,km:0,kcal:kcalMin(t.name)*mins};
  logCardio(t.name,t.date,en,true);save();render();sfx('done');
  toast(`${t.name}: ${fv(mins)} dk · ${Math.round(en.kcal)} kcal kaydedildi`);
}
function cancelTimer(){S.timer=null;save();render();}

  const D=viewDate,prev=waterTotal(D);

  }
  const nm=F.name,en=cardioCalc(nm,F.mode,goal);
  S.last[nm]={cardio:true,mode:F.mode,goal};
  if(bfDate){logCardio(nm,bfDate,en);save();afterSave(mode,nm);return;}
  if(F.editId){
    if(F.kind==='extra'){logCardio(nm,viewDate,en);}
    else{
      const e=planList(viewDate).find(x=>x.id===F.editId);
      if(e){
        const had=logOn(e.name,viewDate);
        e.mode=F.mode;e.goal=goal;
        if(had&&F.mode!=='free')logCardio(e.name,viewDate,en);
      }
    }
    save();render();closeSheet();return;
  }
  planList(viewDate).push({id:uid(),name:nm,cardio:true,mode:F.mode,goal});
  save();render();afterSave(mode,nm);
}


/* ========== Hareket ilerlemesi ========== */
let progName='',progMetric='kg',progRange='all';
const METR={kg:['Ağırlık','kg'],rm:['Tahmini 1RM','kg'],vol:['Hacim','kg'],rep:['Toplam tekrar','tekrar']};
const METC={mins:['Süre','dk'],kcal:['Kalori','kcal'],km:['Mesafe','km']};
const mval=(x,m)=>x.c?(m==='kcal'?x.kcal:m==='km'?x.km:x.mins)
  :(m==='kg'?x.kg:m==='rm'?x.kg*(1+x.reps/30):m==='vol'?x.kg*x.sets*x.reps:x.sets*x.reps);
function showProg(name,m,r){
  progName=name;if(r)progRange=r;
  const a=S.log[name]||[];
  const cardio=isCardio(name)||a.some(x=>x.c);
  const MT=cardio?METC:METR;
  if(m&&MT[m])progMetric=m;else progMetric=cardio?'mins':((a.length&&a.every(x=>!x.kg))?'rep':'kg');
  let body;
  if(!a.length){
    body=`<div class="empty" style="margin-top:8px"><b>Henüz kayıt yok</b>Bu hareketi çizelgede tamamladığında veya takvimden bir tarihe eklediğinde kayıtlar buraya düşer.</div>`;
  }else{
    const fa=a.filter(x=>inRange(x.d,progRange));
    const unit=MT[progMetric][1];
    const mchips=Object.keys(MT).map(k=>`<button class="chip${k===progMetric?' on':''}" data-metric="${k}">${MT[k][0]}</button>`).join('');
    let mid;
    if(!fa.length){
      mid=`<div class="note" style="margin:6px 2px 4px">Bu aralıkta kayıt yok. Aralığı genişletebilirsin.</div>`;
    }else{
      const pts=fa.map(x=>({d:x.d,v:mval(x,progMetric)}));
      const first=pts[0].v,last=pts[pts.length-1].v,best=Math.max(...pts.map(p=>p.v));
      const diff=last-first;
      const dTxt=pts.length<2?'–':(diff>0?'+':'')+fv(diff)+' '+unit;
      const dCls=pts.length<2||diff===0?'':diff>0?'up':'down';
      mid=`<div class="stats">
        <div class="stat"><small>Son</small><b>${fv(last)} ${unit}</b></div>
        <div class="stat"><small>Değişim</small><b class="${dCls}">${dTxt}</b></div>
        <div class="stat"><small>Rekor</small><b>${fv(best)} ${unit}</b></div>
      </div>
      <div class="chartbox">${chartSvg(pts,progRange)}</div>
      ${pts.length<2?'<div class="note">Çizgi için en az iki kayıt gerekir.</div>':''}`;
    }
    const rows=[...a.keys()].reverse().map(i=>{const x=a[i],L=logLine(x);
      return `<div class="hrow"><div class="hd"><b>${fdate(x.d)}</b><small>${L.sub}</small></div><div class="hv">${L.val}</div><button class="hx" data-ld="${i}" aria-label="Kaydı sil">${IC.x}</button></div>`;}).join('');
    body=`<div class="chips">${mchips}</div><div class="chips">${rangeChips('prange',progRange)}</div>${mid}<div class="hh">Geçmiş</div>${rows}`;
  }
  $('sheet').innerHTML=`
    <div class="sh-head"><h3>${esc(name)}</h3><button class="ib" data-close="1" aria-label="Kapat">${IC.x}</button></div>
    <div class="sh-body">${body}</div>`;
  F=null;openSheet();
}

/* ========== İstatistikler ========== */
let statTab='bw',statRange='30';
function gains(range){
  const out=[];
  for(const name in S.log){
    const a=S.log[name].filter(x=>inRange(x.d,range));if(!a.length)continue;
    const cardio=a.some(x=>x.c);
    const useKg=a.some(x=>x.kg>0);
    const val=x=>cardio?(x.mins||0):useKg?x.kg:x.sets*x.reps;
    const f=val(a[0]),l=val(a[a.length-1]);
    out.push({name,n:a.length,f,l,diff:l-f,unit:cardio?'dk':useKg?'kg':'tekrar'});
  }
  out.sort((p,q)=>(q.n>1)-(p.n>1)||q.diff-p.diff);
  return out;
}
function kcalSeries(range){
  const m={};
  for(const n in S.log)S.log[n].forEach(x=>{if(x.c&&inRange(x.d,range))m[x.d]=(m[x.d]||0)+(x.kcal||0);});
  return Object.keys(m).sort().map(d=>({d,v:m[d]}));
}
function showStats(){
  const T=(k,l)=>`<button class="chip${statTab===k?' on':''}" data-stab="${k}">${l}</button>`;
  const tabs=`<div class="chips">${T('bw','Vücut kilosu')}${T('kcal','Kalori')}${T('gain','Hareket artışı')}</div>`;
  const rch=`<div class="chips">${rangeChips('srange',statRange)}</div>`;
  let body;
  if(statTab==='bw'){
    const fa=S.bw.filter(x=>inRange(x.d,statRange));
    const cur=S.bw.length?S.bw[S.bw.length-1]:null;
    const diff=fa.length>1?fa[fa.length-1].kg-fa[0].kg:null;
    const avg=fa.length?fa.reduce((t,x)=>t+x.kg,0)/fa.length:null;
    const rows=[...fa].reverse().map(x=>`<div class="hrow"><div class="hd"><b>${fdate(x.d)}</b></div><div class="hv">${fb(x.kg)} kg</div><button class="hx" data-bwdel="${x.d}" data-ctx="stats" aria-label="Kaydı sil">${IC.x}</button></div>`).join('');
    body=`
      <div class="field" style="margin:6px 0 14px"><label for="bwd">Kilo ekle</label>
        <div class="inl" style="margin-bottom:8px"><input id="bwd" type="date" value="${iso(new Date())}" aria-label="Tarih"></div>
        <div class="inl"><input id="bwk" type="text" inputmode="decimal" placeholder="Kilo (kg)" aria-label="Kilo"><button class="btn pri" data-bwsave="1" data-ctx="stats">Kaydet</button></div>
      </div>
      ${rch}
      <div class="stats">
        <div class="stat"><small>Güncel</small><b>${cur?fb(cur.kg)+' kg':'–'}</b></div>
        <div class="stat"><small>Değişim</small><b>${diff===null?'–':(diff>0?'+':'')+fb(diff)+' kg'}</b></div>
        <div class="stat"><small>Ortalama</small><b>${avg===null?'–':fb(avg)+' kg'}</b></div>
      </div>
      ${fa.length?`<div class="chartbox">${chartSvg(fa.map(x=>({d:x.d,v:x.kg})),statRange,fb)}</div>`:'<div class="empty" style="margin-top:6px"><b>Bu aralıkta kayıt yok</b>Yukarıdan kilonu ekle veya aralığı genişlet.</div>'}
      ${fa.length===1?'<div class="note">Çizgi için en az iki kayıt gerekir.</div>':''}
      ${rows?`<div class="hh">Kayıtlar</div>${rows}`:''}`;
  }else if(statTab==='kcal'){
    const ser=kcalSeries(statRange);
    const tot=ser.reduce((t,x)=>t+x.v,0),mx=ser.length?Math.max(...ser.map(x=>x.v)):0;
    const rows=[...ser].reverse().map(x=>`<div class="hrow"><div class="hd"><b>${fdate(x.d)}</b></div><div class="hv">${Math.round(x.v)} kcal</div></div>`).join('');
    body=`${rch}
      <div class="stats">
        <div class="stat"><small>Toplam</small><b>${Math.round(tot)} kcal</b></div>
        <div class="stat"><small>Günlük ort.</small><b>${ser.length?Math.round(tot/ser.length):0} kcal</b></div>
        <div class="stat"><small>En yüksek</small><b>${Math.round(mx)} kcal</b></div>
      </div>
      ${ser.length?`<div class="chartbox">${chartSvg(ser,statRange,v=>String(Math.round(v)))}</div>`:'<div class="empty" style="margin-top:6px"><b>Bu aralıkta kardiyo kaydı yok</b>Kalori yalnızca kardiyo hareketlerinden hesaplanır.</div>'}
      ${ser.length===1?'<div class="note">Çizgi için en az iki gün kaydı gerekir.</div>':''}
      ${rows?`<div class="hh">Günlük yakılan</div>${rows}`:''}`;
  }else{
    const g=gains(statRange);
    const rows=g.map(x=>{
      const cls=x.n<2||x.diff===0?'':x.diff>0?'up':'down';
      const txt=x.n<2?'tek kayıt':(x.diff>0?'+':'')+fv(x.diff)+' '+x.unit;
      return `<button class="grow" data-hist="${esc(x.name)}" data-pr="${statRange}"><div class="hd"><b>${esc(x.name)}</b><small>${x.n} kayıt</small></div><div class="rt"><div class="hv">${fv(x.f)} → ${fv(x.l)} ${x.unit}</div><span class="badge ${cls}">${txt}</span></div></button>`;
    }).join('');
    body=`${rch}<div class="note" style="margin:0 2px 6px">Seçilen aralıktaki ilk ve son kayıt karşılaştırılır. Ağırlık hareketlerinde kilo, kardiyoda süre (dk) kullanılır. Grafik için bir harekete dokun.</div>`+
      (rows||'<div class="empty" style="margin-top:6px"><b>Bu aralıkta kayıt yok</b>Hareketleri tamamladıkça veya takvimden ekledikçe burada görünür.</div>');
  }
  $('sheet').innerHTML=`
    <div class="sh-head"><h3>Gelişim</h3><button class="ib" data-close="1" aria-label="Kapat">${IC.x}</button></div>
    <div class="sh-body">${tabs}${body}</div>`;
  F=null;openSheet('stats');
}

/* ========== Olaylar ========== */
document.addEventListener('click',ev=>{
  if(ev.target===$('ov')){closeSheet();return;}
  const t=ev.target.closest('button');
  if(!t)return;
  clearTimeout(pendTap);pendTap=setTimeout(()=>SFX.tap(),0);
  const d=t.dataset;
  if(d.day!==undefined){setView(d.day);return;}
  if(d.wk){setView(addDays(viewDate,7*(+d.wk)));return;}
  if(d.today){setView(iso(new Date()));return;}
  if(d.nav==='home'){closeSheet();return;}
  if(d.nav==='set'){showSettings();return;}
  if(d.stats){showStats();return;}
  if(d.cal==='open'){showCal(viewDate);return;}
  if(t.id==='plusBtn'||d.add){showPick();return;}
  if(d.info){showInfo(d.info);return;}
  if(d.done){
    const e=planList(viewDate).find(x=>x.id===d.done);
    if(e){
      if(logOn(e.name,viewDate)){logUnset(e.name,viewDate);save();render();sfx('undo');}
      else{
        if(e.cardio)logCardio(e.name,viewDate,cardioCalc(e.name,e.mode,e.goal));
        else logAt(e.name,viewDate,e.kg,e.sets,e.reps);
        save();render();sfx('done');toast(DAYS[sel][1]+' ('+sdate(viewDate)+') için kaydedildi');
      }
    }
    return;
  }
  if(d.edit){
    const r=curRows.find(x=>x.id===d.edit);if(!r)return;
    if(r.cardio){
      if(r.kind==='plan'){const e=planList(viewDate).find(x=>x.id===r.id);if(e)showCForm({editId:r.id,kind:'plan',name:r.name,cardio:true,mode:e.mode,goal:e.goal});}
      else showCForm({editId:r.id,kind:'extra',name:r.name,cardio:true,mode:r.mode,goal:r.goal,mins:r.mins});
    }else showForm({editId:r.id,kind:r.kind,name:r.name,kg:r.kg,sets:r.sets,reps:r.reps});
    return;
  }
  if(d.hist){showProg(d.hist,null,d.pr||'all');return;}
  if(d.prange){progRange=d.prange;showProg(progName,progMetric);return;}
  if(d.metric){showProg(progName,d.metric);return;}
  if(d.ld!==undefined){const a=S.log[progName]||[];a.splice(+d.ld,1);save();showProg(progName,progMetric);return;}
  if(d.stab){statTab=d.stab;showStats();return;}
  if(d.srange){statRange=d.srange;showStats();return;}
  if(d.calnav){calM+=+d.calnav;if(calM<0){calM=11;calY--;}else if(calM>11){calM=0;calY++;}renderCal(true);return;}
  if(d.calday){calSel=d.calday;setView(d.calday);renderCal(true,true);return;}
  if(d.gotoday){setView(calSel);closeSheet();return;}
  if(d.caladd){bfDate=calSel;showPick();return;}
  if(d.lgdel!==undefined){const c=calItems[+d.lgdel];if(c){S.log[c.n].splice(c.i,1);save();renderCal(true);}return;}
  if(d.bwsave){
    let date,raw;
    if(d.ctx==='cal'){date=calSel;raw=$('bw').value;}else{date=$('bwd').value;raw=$('bwk').value;}
    const v=parseFloat(String(raw).replace(',','.'));
    if(!date||!isFinite(v)||v<20||v>400){toast('Geçerli bir kilo gir');return;}
    S.bw=S.bw.filter(x=>x.d!==date);S.bw.push({d:date,kg:Math.round(v*10)/10});S.bw.sort((p,q)=>p.d<q.d?-1:1);save();
    if(d.ctx==='cal')renderCal(true);else showStats();
    toast('Kilo kaydedildi');return;
  }
  if(d.bwdel){S.bw=S.bw.filter(x=>x.d!==d.bwdel);save();if(d.ctx==='cal')renderCal(true);else showStats();return;}
  if(d.close){if(bfDate){const x=bfDate;bfDate=null;showCal(x);}else closeSheet();return;}
  if(d.cat){pickCat=d.cat;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.cat===pickCat));renderPick();return;}
  if(d.pick){openEx(d.pick);return;}
  if(d.new){const n=d.new;if(!allNames().some(x=>norm(x.n)===norm(n))){S.custom.push(n);save();}openEx(n);return;}
  if(d.newc){const n=d.newc;if(!allNames().some(x=>norm(x.n)===norm(n))){S.customCardio.push(n);save();}openEx(n);return;}
  if(d.backpick){showPick();return;}
  if(d.stp){
    const [id,v]=d.stp.split(':');const el=$(id);if(!el)return;
    let cur=parseFloat(String(el.value).replace(',','.'));if(!isFinite(cur))cur=0;
    cur=Math.max(+(el.dataset.min||0),cur+parseFloat(v));
    el.value=fmt(Math.round(cur*100)/100);
    if(id==='c_goal')updCEst();
    return;
  }
  if(d.cmode){setCMode(d.cmode);return;}
  if(d.save){if(F&&F.cardio)commitCardio(d.save);else commit(d.save);return;}
  if(d.del){
    if(F.kind==='extra'){logUnset(F.name,viewDate);}
    else{const items=planList(viewDate);const i=items.findIndex(x=>x.id===F.editId);if(i>-1){logUnset(items[i].name,viewDate);items.splice(i,1);}}
    save();closeSheet();return;
  }
  if(d.tstart){startTimer(d.tstart);return;}
  if(d.tpause){pauseTimer();return;}
  if(d.tfinish){finishTimer();return;}
  if(d.tcancel){cancelTimer();return;}
  if(d.wadd){addWater();return;}
  if(d.wundo){undoWater();return;}
  if(d.wset){showSettings();return;}
  if(d.snd!==undefined){S.cfg.sound=d.snd==='1';save();showSettings();if(S.cfg.sound)sfx('add');return;}
  if(d.cfgsave){if(saveSettings()){closeSheet();toast('Ayarlar kaydedildi');}return;}
  if(d.bk==='open'){showBackup();return;}
  if(d.bk==='export'){const ta=$('bk');ta.value=JSON.stringify(S);ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}toast(ok?'Yedek kopyalandı':'Metni seçip kopyala');return;}
  if(d.bk==='import'){importBackup(t);return;}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){pickQ=ev.target.value;renderPick();}
  if(ev.target.id==='c_goal')updCEst();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!drag){render();}});

/* ---------- Sürükleyerek sıralama ---------- */
let drag=null;
document.addEventListener('contextmenu',ev=>{if(ev.target.closest('.grip'))ev.preventDefault();});
document.addEventListener('pointerdown',ev=>{
  const g=ev.target.closest('.grip');if(!g||drag)return;
  const row=g.closest('.ex');const rows=[...document.querySelectorAll('#list .ex')];
  const from=rows.indexOf(row);if(from<0)return;
  ev.preventDefault();
  const rects=rows.map(r=>{const b=r.getBoundingClientRect();return{top:b.top+window.scrollY,h:b.height};});
  drag={row,rows,rects,from,to:from,startY:ev.clientY,y:ev.clientY,sy:window.scrollY,raf:0};
  rows.forEach(r=>{if(r!==row)r.classList.add('shift');});
  row.classList.add('dragging');
  document.body.style.userSelect='none';
  try{g.setPointerCapture(ev.pointerId);}catch(e){}
  dragTick();
});
function dragUpdate(){
  const d=drag;if(!d)return;
  const dy=(d.y-d.startY)+(window.scrollY-d.sy);
  d.row.style.transform=`translateY(${dy}px)`;
  const me=d.rects[d.from];const center=me.top+me.h/2+dy;
  let to=0;d.rects.forEach((r,i)=>{if(i!==d.from&&r.top+r.h/2<center)to++;});
  d.to=to;const shift=me.h+10;
  d.rows.forEach((r,i)=>{
    if(i===d.from)return;let t=0;
    if(d.from<to&&i>d.from&&i<=to)t=-shift;
    else if(d.from>to&&i>=to&&i<d.from)t=shift;
    r.style.transform=t?`translateY(${t}px)`:'';
  });
}
function dragTick(){
  if(!drag)return;
  if(drag.y<90)window.scrollBy(0,-10);else if(drag.y>window.innerHeight-90)window.scrollBy(0,10);
  dragUpdate();drag.raf=requestAnimationFrame(dragTick);
}
document.addEventListener('pointermove',ev=>{if(drag){drag.y=ev.clientY;ev.preventDefault();}},{passive:false});
function endDrag(cancel){
  const d=drag;if(!d)return;
  cancelAnimationFrame(d.raf);drag=null;document.body.style.userSelect='';
  if(!cancel&&d.to!==d.from){const arr=planList(viewDate);const m=arr.splice(d.from,1)[0];arr.splice(d.to,0,m);save();}
  render();
}
document.addEventListener('pointerup',()=>endDrag(false));
document.addEventListener('pointercancel',()=>endDrag(true));

let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}


/* ========== Başlangıç ========== */
if(!hadData)S.v=2;else migrate2();
render();
</script>
