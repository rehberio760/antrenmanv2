<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A4DFF">
<title>Antrenman Çizelgem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#E4E9F2; --ink:#121826; --muted:#5B6578;
  --line:#D5DBE7; --accent:#3A4DFF; --on-accent:#FFFFFF; --done:#1F9D6B; --danger:#D6334A;
  --head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1420; --surface:#1A2133; --surface2:#242D44; --ink:#EAEFFA; --muted:#97A3BC;
    --line:#2B3550; --accent:#7C8CFF; --on-accent:#0F1420; --done:#4CD39A; --danger:#FF6B80;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1420; --surface:#1A2133; --surface2:#242D44; --ink:#EAEFFA; --muted:#97A3BC;
  --line:#2B3550; --accent:#7C8CFF; --on-accent:#0F1420; --done:#4CD39A; --danger:#FF6B80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:520px;margin:0 auto;padding:16px 16px 40px}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 2px 14px}
.tools{display:flex;gap:8px;flex:none}
.tools .ib{width:42px;height:42px;background:var(--surface);border:1px solid var(--line)}
.top h1{font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0}
.top .date{color:var(--muted);font-size:14px;margin-top:2px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dbtn{position:relative;padding:10px 0 9px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--head);font-weight:600;font-size:17px;letter-spacing:.03em}
.dbtn .cnt{font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);min-height:14px;line-height:14px}
.dbtn.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dbtn.sel .cnt{color:var(--on-accent);opacity:.85}
.dbtn.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dbtn.sel.today::after{background:var(--on-accent)}

.dayhead{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.dayhead h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1;margin:0}
.dayhead .sub{color:var(--muted);font-size:14px;margin-top:4px}
.plus{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(58,77,255,.35);flex:none}
.plus svg{width:28px;height:28px}
.plus:active{transform:scale(.94)}

.list{display:flex;flex-direction:column;gap:10px}
.ex{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 4px;position:relative}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk svg{width:16px;height:16px}
.ex.done .chk{background:var(--done);border-color:var(--done);color:#fff}
.ex .info{flex:1;min-width:0;text-align:left}
.ex .edit{display:block;width:100%;text-align:left;padding:2px 0}
.ex .name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.ex .meta{color:var(--muted);font-size:14px;margin-top:2px}
.ex .kg{font-family:var(--head);font-weight:700;font-size:24px;white-space:nowrap}
.ex .kg small{font-size:14px;color:var(--muted);margin-left:2px;font-family:var(--body);font-weight:500}
.ex.done .name{text-decoration:line-through;color:var(--muted)}
.qm{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:18px;
  display:grid;place-items:center;flex:none;line-height:1}
.qm:active{background:var(--accent);color:var(--on-accent)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.addrow{margin-top:12px;width:100%;padding:14px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-weight:600}
.addrow:active{background:var(--surface2)}
.clear{display:block;margin:18px auto 0;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}

.ov{position:fixed;inset:0;background:rgba(8,12,24,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:90%;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 8px}
.sh-head h3{font-family:var(--head);font-size:24px;font-weight:700;margin:0;overflow-wrap:anywhere}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:none}
.ib svg{width:20px;height:20px}
.sh-body{overflow-y:auto;padding:4px 16px 18px}
.search{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--on-accent)}
.pick{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:17px}
.pick span{color:var(--muted);font-size:13px;margin-left:8px}
.pick.new{color:var(--accent);font-weight:600}
.nores{color:var(--muted);padding:14px 4px}
.count{color:var(--muted);font-size:13px;margin:0 0 4px 2px}

.field{margin:14px 0}
.field label{display:block;font-weight:600;margin-bottom:8px}
.stp{display:flex;align-items:center;gap:10px}
.stp button{width:52px;height:52px;border-radius:14px;background:var(--surface2);font-size:26px;font-weight:600;flex:none}
.stp button:active{background:var(--line)}
.stp input{flex:1;min-width:0;height:52px;text-align:center;font-family:var(--head);font-weight:700;font-size:30px;border-radius:14px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.last{color:var(--muted);font-size:13px;margin-top:6px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn{padding:15px;border-radius:14px;font-weight:600;font-size:17px;text-align:center}
a.btn{display:block;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.del{color:var(--danger);background:none}

/* Hareket bilgi paneli */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.tag{padding:5px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600}
.diagram{background:var(--bg);border-radius:16px;padding:12px 8px 6px;margin-bottom:12px}
.diagram svg{display:block;width:100%;max-width:300px;margin:0 auto}
.sil{fill:var(--surface2);stroke:var(--line);stroke-width:1.2}
.mp *{fill:var(--accent)}
.ms *{fill:var(--accent);opacity:.4}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin:0 2px 14px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:baseline}
.dot.s{opacity:.4}
.steps{margin:0 0 14px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);line-height:1.4}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.tip{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4;margin-bottom:6px}
.tip b{display:block;margin-bottom:2px}
.note{color:var(--muted);font-size:13px;margin:8px 2px 0;line-height:1.4}

.grip{width:26px;height:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grip svg{width:16px;height:16px}
.ex.shift{transition:transform .16s ease}
.ex.dragging{z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.28);transition:none;border-color:var(--accent)}
.hist{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 11px 4px 8px;border-radius:99px;background:var(--surface2);color:var(--accent);font-size:13px;font-weight:600}
.hist svg{width:14px;height:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.stat{background:var(--bg);border-radius:12px;padding:10px 10px 9px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.stat b{font-family:var(--head);font-size:22px;font-weight:700;line-height:1.1}
.stat b.up{color:var(--done)}
.stat b.down{color:var(--danger)}
.chartbox{background:var(--bg);border-radius:16px;padding:10px 6px 4px;margin-bottom:6px}
.chartbox svg{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--accent);opacity:.13}
.pt{fill:var(--bg);stroke:var(--accent);stroke-width:2.5}
.pt.last{fill:var(--accent)}
.ax{fill:var(--muted);font-size:10px}
.vl{fill:var(--ink);font-size:11px;font-weight:700}
.hh{font-family:var(--head);font-size:20px;font-weight:700;margin:16px 2px 2px}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.hrow .hd{flex:1}
.hrow .hd small{display:block;color:var(--muted);font-size:13px}
.hrow .hv{font-family:var(--head);font-weight:700;font-size:20px}
.hx{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.hx svg{width:16px;height:16px}
.ta{width:100%;min-height:150px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.linkbtn{display:block;margin:22px auto 0;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.calhead b{font-family:var(--head);font-size:24px;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cd{aspect-ratio:1/1;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:15px}
.cd.t{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.s{background:var(--accent);color:var(--on-accent)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.w{background:var(--done)}
.cd.s .dots i{background:var(--on-accent)}
.cd.s .dots i.w{background:var(--on-accent);opacity:.55}
.inl{display:flex;gap:10px;align-items:center}
.inl input{flex:1;min-width:0;height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--head);font-weight:700;font-size:22px}
.inl .btn{height:52px;padding:0 20px;display:grid;place-items:center}
.grow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.grow .hd{flex:1;min-width:0}
.grow .hd small{display:block;color:var(--muted);font-size:13px}
.grow .hd b{overflow-wrap:anywhere}
.grow .rt{text-align:right;flex:none}
.grow .hv{font-family:var(--head);font-weight:700;font-size:18px;white-space:nowrap}
.badge{display:inline-block;margin-top:3px;font-family:var(--head);font-weight:700;font-size:16px;padding:1px 10px;border-radius:99px;background:var(--surface2)}
.badge.up{color:var(--done)}
.badge.down{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-weight:600;font-size:15px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>Antrenman Çizelgem</h1><div class="date" id="today"></div></div>
    <div class="tools">
      <button class="ib" data-stats="1" aria-label="İstatistikler: kilo ve gelişim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg></button>
      <button class="ib" data-cal="open" aria-label="Takvim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
    </div>
  </div>
  <div class="week" id="week"></div>
  <div class="dayhead">
    <div><h2 id="dayName"></h2><div class="sub" id="daySub"></div></div>
    <button class="plus" id="plusBtn" aria-label="Hareket ekle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div class="list" id="list"></div>
  <div id="foot"></div>
  <button class="linkbtn" data-bk="open">Yedekle / geri yükle</button>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Hareket veritabanı ----------
   Ad|Kategori|Ana kaslar|Yardımcı kaslar|Ekipman|Adımlar (;)|İpucu|(ops.) İngilizce arama adı */
const RAW=`
Bench Press|Göğüs|gog|omuz,tri|Barbell|Sehpada sırtüstü yat, ayaklar yerde, kürek kemiklerini birbirine sık;Barı omuz genişliğinden biraz geniş tut ve göğüs ortasına kontrollü indir;Dirsekler gövdeyle yaklaşık 45° açıda olsun, barı yukarı it|Kalçayı sehpadan kaldırma, bilekleri düz tut.
Incline Bench Press|Göğüs|gog,omuz|tri|Barbell|Sehpayı 30-45° eğime ayarla;Barı üst göğse indir;Dirsekleri kilitlemeden yukarı it|Eğim çok dik olursa yük omuza biner.
Decline Bench Press|Göğüs|gog|tri,omuz|Barbell|Başın aşağıda olacak şekilde sehpaya sabitlen;Barı alt göğse indir;Kontrollü şekilde yukarı it|Mutlaka yardımcı biriyle yap.
Dumbbell Press|Göğüs|gog|omuz,tri|Dumbbell|Dumbbell'ları göğüs hizasında tut, avuç içleri ileri baksın;Kolları yukarı it, üstte dumbbell'lar birbirine yaklaşsın;Yavaşça göğüs hizasına indir|Alt noktada dirsekleri çok açma.
Incline Dumbbell Press|Göğüs|gog,omuz|tri|Dumbbell|Sehpayı 30-45° eğime ayarla;Dumbbell'ları üst göğüs hizasından yukarı it;Kontrollü şekilde indir|Omuzları geride ve aşağıda tut.
Dumbbell Fly|Göğüs|gog|omuz|Dumbbell|Sırtüstü yat, kollar yukarıda ve dirsekler hafif bükülü;Kolları yanlara geniş bir yay çizerek aç;Göğsü sıkarak başlangıca dön|Ağırlığı hafif tut, dirsek açısı sabit kalsın.
Cable Crossover|Göğüs|gog|omuz|Makara|İki makaranın ortasında, gövde hafif öne eğik dur;Kolları dirsekler hafif bükülü şekilde önde birleştir;Göğüs gerilene kadar yavaşça aç|Birleşim noktasında göğsü bir saniye sık.
Low Cable Fly|Göğüs|gog|omuz|Makara|Makaraları en alta ayarla ve bir adım öne çık;Kolları aşağıdan yukarı yay çizerek çene önünde birleştir;Yavaşça geri bırak|Üst göğsü hedefler.
Pec Deck|Göğüs|gog|omuz|Makine|Sırtını yasla, kolları pedlere yerleştir;Kolları önde birleştir;Yavaşça geri aç|Omuzlar öne yuvarlanmasın.
Chest Press Makinesi|Göğüs|gog|tri,omuz|Makine|Koltuğu tutaçlar göğüs hizasında olacak şekilde ayarla;Tutaçları öne doğru it;Kontrollü şekilde geri getir|Sırt ve kalça yastığa yapışık kalsın.|chest press machine
Smith Machine Bench Press|Göğüs|gog|omuz,tri|Smith makinesi|Sehpayı barın altına göğüs hizasında yerleştir;Barı kilitten çıkarıp göğse indir;Yukarı it|Bar yolu sabit olduğu için ayak ve sırt duruşuna dikkat et.
Dumbbell Pullover|Göğüs|gog,kanat|tri|Dumbbell|Sehpaya enine uzan, dumbbell'ı iki elle göğüs üstünde tut;Kollar hafif bükülü, dumbbell'ı başın arkasına indir;Aynı yayla göğse geri getir|Hareket boyunca kalça sabit kalsın.
Landmine Press|Göğüs|omuz,gog|tri|Barbell|Barın ucunu omuz hizasında tut;Barı çapraz yukarı doğru it;Kontrollü şekilde indir|Gövde sabit, bel kavisi korunsun.
Şınav|Göğüs|gog|omuz,tri,karin|Vücut ağırlığı|Eller omuzdan biraz geniş, vücut baştan topuğa düz;Göğsünü yere yaklaştır;Yerden iterek başlangıca dön|Bel çökmesin, karnı sık.|push up
Diamond Şınav|Göğüs|tri|gog,omuz|Vücut ağırlığı|Elleri göğsün altında baş ve işaret parmakları birleşecek şekilde yerleştir;Göğsü ellere doğru indir;İterek yüksel|Zorlanırsan dizlerinde yap.|diamond push up
Dips|Göğüs|tri,gog|omuz|Paralel bar|Paralel barlarda kolları düz tutarak yüksel;Gövdeyi hafif öne eğerek kontrollü in;Dirsekler yaklaşık 90° olunca yukarı it|Göğüs için öne eğil, triseps için dik kal.

let progName='',progMetric='kg';
const METR={kg:['Ağırlık','kg'],rm:['Tahmini 1RM','kg'],vol:['Hacim','kg'],rep:['Toplam tekrar','tekrar']};
const mval=(en,m)=>m==='kg'?en.kg:m==='rm'?en.kg*(1+en.reps/30):m==='vol'?en.kg*en.sets*en.reps:en.sets*en.reps;
const r1=n=>Math.round(n*10)/10;
const fv=n=>Math.abs(n)>=100?String(Math.round(n)):fmt(r1(n));
const pd=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const fdate=s=>pd(s).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
const sdate=s=>pd(s).toLocaleDateString('tr-TR',{day:'numeric',month:'short'});

/* ---------- Tarih ve aralık yardımcıları ---------- */
const dayIdx=s=>Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/86400000);
const idxLabel=t=>new Date(t*86400000).toLocaleDateString('tr-TR',{day:'numeric',month:'short',timeZone:'UTC'});
const RANGES={'7':['Haftalık',7],'30':['Aylık',30],'90':['3 Aylık',90],all:['Tümü',0]};
const todayDN=()=>dayIdx(iso(new Date()));
const inRange=(d,r)=>r==='all'||dayIdx(d)>=todayDN()-(RANGES[r][1]-1);
const rangeChips=(attr,cur)=>Object.keys(RANGES).map(k=>`<button class="chip${k===cur?' on':''}" data-${attr}="${k}">${RANGES[k][0]}</button>`).join('');
const fb=n=>fmt(r1(n));

/* ---------- Çizgi grafik (tarih ölçekli) ---------- */
function chartSvg(pts,range,f){
  f=f||fv;
  const W=320,H=210,L=42,R=16,T=22,B=30,iw=W-L-R,ih=H-T-B;
  const n=pts.length,di=pts.map(p=>dayIdx(p.d));
  let t0,t1;
  if(range&&range!=='all'){t1=Math.max(todayDN(),di[n-1]);t0=t1-(RANGES[range][1]-1);}
  else{t0=di[0];t1=di[n-1];}
  const span=t1-t0;
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);
  let pad=(hi-lo)*0.25;if(!pad)pad=Math.max(1,Math.abs(hi)*0.1);
  lo=Math.max(0,lo-pad);hi=hi+pad;
  const X=t=>span?L+iw*(t-t0)/span:L+iw/2;
  const Y=v=>T+ih*(1-(v-lo)/(hi-lo));
  let g='';
  for(let k=0;k<4;k++){const v=lo+(hi-lo)*k/3,yy=Y(v);
    g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-6}" y="${yy+3.5}" text-anchor="end">${f(v)}</text>`;}
  const tk=[];
  if(span<=0)tk.push(t0);else if(span<=7){for(let t=t0;t<=t1;t++)tk.push(t);}else{for(let k=0;k<5;k++)tk.push(t0+Math.round(span*k/4));}
  const xl=tk.map((t,i)=>`<text class="ax" x="${X(t)}" y="${H-10}" text-anchor="${tk.length>1&&i===0?'start':tk.length>1&&i===tk.length-1?'end':'middle'}">${idxLabel(t)}</text>`).join('');
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(di[i])} ${Y(p.v)}`).join(' ');
  const area=n>1?`<path class="ar" d="${line} L${X(di[n-1])} ${T+ih} L${X(di[0])} ${T+ih} Z"/>`:'';
  const dots=pts.map((p,i)=>`<circle class="pt${i===n-1?' last':''}" cx="${X(di[i])}" cy="${Y(p.v)}" r="${i===n-1?5:3.5}"/>`).join('');
  const lx=X(di[n-1]),ly=Y(pts[n-1].v);
  const lab=`<text class="vl" x="${lx}" y="${ly-10}" text-anchor="${lx>W-44?'end':'middle'}">${f(pts[n-1].v)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Çizgi grafik">${g}${area}${n>1?`<path class="ln" d="${line}"/>`:''}${dots}${lab}${xl}</svg>`;
}

function showProg(name,m,r){
  progName=name;if(r)progRange=r;
  const a=S.log[name]||[];
  if(m)progMetric=m;else progMetric=(a.length&&a.every(x=>!x.kg))?'rep':'kg';
  let body;

    body=`<div class="empty" style="margin-top:8px"><b>Henüz kayıt yok</b>Bu hareketi çizelgede ✓ ile tamamladığında veya takvimden bir tarihe eklediğinde kilo, set ve tekrar buraya kaydedilir.</div>`;
  }else{
    const fa=a.filter(x=>inRange(x.d,progRange));
    const unit=METR[progMetric][1];
    const mchips=Object.keys(METR).map(k=>`<button class="chip${k===progMetric?' on':''}" data-metric="${k}">${METR[k][0]}</button>`).join('');
    let mid;
    if(!fa.length){
      mid=`<div class="note" style="margin:6px 2px 4px">Bu aralıkta kayıt yok. Aralığı genişletebilirsin.</div>`;
    }else{
      const pts=fa.map(x=>({d:x.d,v:mval(x,progMetric)}));
      const first=pts[0].v,last=pts[pts.length-1].v,best=Math.max(...pts.map(p=>p.v));
      const diff=last-first;
      const dTxt=pts.length<2?'–':(diff>0?'+':'')+fv(diff)+' '+unit;
      const dCls=pts.length<2||diff===0?'':diff>0?'up':'down';
      mid=`<div class="stats">
        <div class="stat"><small>Son</small><b>${fv(last)} ${unit}</b></div>
        <div class="stat"><small>Değişim</small><b class="${dCls}">${dTxt}</b></div>
        <div class="stat"><small>Rekor</small><b>${fv(best)} ${unit}</b></div>
      </div>
      <div class="chartbox">${chartSvg(pts,progRange)}</div>
      ${pts.length<2?'<div class="note">Çizgi için en az iki kayıt gerekir.</div>':''}`;
    }
    const rows=[...a.keys()].reverse().map(i=>{const x=a[i];
      return `<div class="hrow"><div class="hd"><b>${fdate(x.d)}</b><small>${x.sets} set × ${x.reps} tekrar</small></div><div class="hv">${x.kg>0?fmt(x.kg)+' kg':'–'}</div><button class="hx" data-ld="${i}" aria-label="Kaydı sil">${IC.x}</button></div>`;}).join('');
    body=`<div class="chips">${mchips}</div><div class="chips">${rangeChips('prange',progRange)}</div>${mid}<div class="hh">Geçmiş</div>${rows}`;
  }
  $('sheet').innerHTML=`
    <div class="sh-head"><h3>${esc(name)}</h3><button class="ib" data-close="1" aria-label="Kapat">${IC.x}</button></div>
    <div class="sh-body">${body}</div>`;
  F=null;openSheet();
}

      <div class="calhead"><button class="ib" data-calnav="-1" aria-label="Önceki ay">${IC.back}</button><b>${title}</b><button class="ib" data-calnav="1" aria-label="Sonraki ay">${IC.fwd}</button></div>
      <div class="cgrid">${cells}</div>
      <div class="legend" style="margin:10px 2px 0"><span><span class="dot"></span>Antrenman</span><span><span class="dot" style="background:var(--done)"></span>Vücut kilosu</span></div>
      <div class="hh" id="dayPanel">${fdate(calSel)} · ${DAYS[wi][1]}</div>
      ${rows}
      <div class="actions" style="margin-top:12px">
        <button class="btn pri" data-caladd="1">+ Bu tarihe hareket ekle</button>
        ${planN?`<button class="btn sec" data-calplan="1">${DAYS[wi][1]} planını bu tarihe kaydet (${planN} hareket)</button>`:''}
      </div>
      <div class="hh">Vücut kilosu</div>
      <div class="inl" style="margin-top:8px"><input id="bw" type="text" inputmode="decimal" placeholder="kg" value="${bw?fmt(bw.kg):''}" aria-label="Vücut kilosu"><button class="btn pri" data-bwsave="1" data-ctx="cal">Kaydet</button>${bw?`<button class="hx" data-bwdel="${calSel}" data-ctx="cal" aria-label="Kilo kaydını sil">${IC.x}</button>`:''}</div>
    </div>`;
  const nb=$('sheet').querySelector('.sh-body');
  if(keep)nb.scrollTop=st;
  if(jump){const pn=$('dayPanel');if(pn)pn.scrollIntoView({block:'nearest',behavior:'smooth'});}
}

/* ---------- İstatistikler: vücut kilosu + hareket artışı ---------- */
let statTab='bw',statRange='30';
function gains(range){
  const out=[];
  for(const name in S.log){
    const a=S.log[name].filter(x=>inRange(x.d,range));if(!a.length)continue;
    const useKg=a.some(x=>x.kg>0);const val=x=>useKg?x.kg:x.sets*x.reps;
    const f=val(a[0]),l=val(a[a.length-1]);
    out.push({name,n:a.length,f,l,diff:l-f,unit:useKg?'kg':'tekrar'});
  }
  out.sort((p,q)=>(q.n>1)-(p.n>1)||q.diff-p.diff);
  return out;
}
function showStats(){
  const tabs=`<div class="chips"><button class="chip${statTab==='bw'?' on':''}" data-stab="bw">Vücut kilosu</button><button class="chip${statTab==='gain'?' on':''}" data-stab="gain">Hareket artışı</button></div>`;
  const rch=`<div class="chips">${rangeChips('srange',statRange)}</div>`;
  let body;
  if(statTab==='bw'){
    const fa=S.bw.filter(x=>inRange(x.d,statRange));
    const cur=S.bw.length?S.bw[S.bw.length-1]:null;
    const diff=fa.length>1?fa[fa.length-1].kg-fa[0].kg:null;
    const avg=fa.length?fa.reduce((t,x)=>t+x.kg,0)/fa.length:null;
    const rows=[...fa].reverse().map(x=>`<div class="hrow"><div class="hd"><b>${fdate(x.d)}</b></div><div class="hv">${fb(x.kg)} kg</div><button class="hx" data-bwdel="${x.d}" data-ctx="stats" aria-label="Kaydı sil">${IC.x}</button></div>`).join('');
    body=`
      <div class="field" style="margin:6px 0 14px"><label for="bwd">Kilo ekle</label>
        <div class="inl" style="margin-bottom:8px"><input id="bwd" type="date" value="${iso(new Date())}" aria-label="Tarih"></div>
        <div class="inl"><input id="bwk" type="text" inputmode="decimal" placeholder="Kilo (kg)" aria-label="Kilo"><button class="btn pri" data-bwsave="1" data-ctx="stats">Kaydet</button></div>
      </div>
      ${rch}
      <div class="stats">
        <div class="stat"><small>Güncel</small><b>${cur?fb(cur.kg)+' kg':'–'}</b></div>
        <div class="stat"><small>Değişim</small><b>${diff===null?'–':(diff>0?'+':'')+fb(diff)+' kg'}</b></div>
        <div class="stat"><small>Ortalama</small><b>${avg===null?'–':fb(avg)+' kg'}</b></div>
      </div>
      ${fa.length?`<div class="chartbox">${chartSvg(fa.map(x=>({d:x.d,v:x.kg})),statRange,fb)}</div>`:'<div class="empty" style="margin-top:6px"><b>Bu aralıkta kayıt yok</b>Yukarıdan kilonu ekle veya aralığı genişlet.</div>'}
      ${fa.length===1?'<div class="note">Çizgi için en az iki kayıt gerekir.</div>':''}
      ${rows?`<div class="hh">Kayıtlar</div>${rows}`:''}`;
  }else{
    const g=gains(statRange);
    const rows=g.map(x=>{
      const cls=x.n<2||x.diff===0?'':x.diff>0?'up':'down';
      const txt=x.n<2?'tek kayıt':(x.diff>0?'+':'')+fv(x.diff)+' '+x.unit;
      return `<button class="grow" data-hist="${esc(x.name)}" data-pr="${statRange}"><div class="hd"><b>${esc(x.name)}</b><small>${x.n} kayıt</small></div><div class="rt"><div class="hv">${fv(x.f)} → ${fv(x.l)} ${x.unit}</div><span class="badge ${cls}">${txt}</span></div></button>`;
    }).join('');
    body=`${rch}<div class="note" style="margin:0 2px 6px">Seçilen aralıktaki ilk ve son kayıt karşılaştırılır. Grafik için bir harekete dokun.</div>`+
      (rows||'<div class="empty" style="margin-top:6px"><b>Bu aralıkta kayıt yok</b>Hareketleri ✓ ile tamamladıkça veya takvimden ekledikçe burada görünür.</div>');
  }
  $('sheet').innerHTML=`
    <div class="sh-head"><h3>İstatistikler</h3><button class="ib" data-close="1" aria-label="Kapat">${IC.x}</button></div>
    <div class="sh-body">${tabs}${body}</div>`;
  F=null;openSheet();
}

/* ---------- Yedekle / geri yükle ---------- */
let bkArm=false;
function showBackup(){
  bkArm=false;
  $('sheet').innerHTML=`
    <div class="sh-head"><h3>Yedekle / geri yükle</h3><button class="ib" data-close="1" aria-label="Kapat">${IC.x}</button></div>
    <div class="sh-body">
      <p style="margin:4px 0 12px;color:var(--muted);line-height:1.45">Çizelgen ve tüm geçmişin tek bir metin olarak yedeklenir. Telefon değiştirirsen veya APK sürümüne geçersen bu metni yapıştırarak verilerini taşıyabilirsin.</p>
      <textarea class="ta" id="bk" spellcheck="false" placeholder="Yedek metni burada görünür. Geri yüklemek için buraya yapıştır."></textarea>
      <div class="actions">
        <button class="btn pri" data-bk="export">Yedeği oluştur ve kopyala</button>
        <button class="btn sec" data-bk="import">Yapıştırdığım yedeği yükle</button>
      </div>
    </div>`;
  F=null;openSheet();
}
function importBackup(btn){
  let p;
  try{p=JSON.parse($('bk').value);}catch(e){p=null;}
  if(!p||typeof p!=='object'||!p.days){toast('Geçerli bir yedek metni değil');return;}
  if(!bkArm){bkArm=true;btn.textContent='Mevcut veri silinecek. Onaylamak için tekrar dokun';return;}
  S=Object.assign({days:{},custom:[],last:{},log:{},bw:[]},p);
  migrate();save();render();closeSheet();toast('Yedek yüklendi');
}

function readForm(){
  const num=(id,def)=>{const v=parseFloat(String($(id).value).replace(',','.'));return isFinite(v)&&v>=0?v:def;};
  F.kg=num('f_kg',0);F.sets=Math.max(1,Math.round(num('f_sets',1)));F.reps=Math.max(1,Math.round(num('f_reps',1)));
}
function commit(mode){
  readForm();
  if(bfDate){
    logAt(F.name,bfDate,F.kg,F.sets,F.reps);save();
    const nm=F.name;
    if(mode==='again'){showPick();toast(nm+' eklendi');}
    else{const x=bfDate;bfDate=null;showCal(x);}
    return;
  }
  const items=dayList(sel);
  if(F.editId){
    const e=items.find(x=>x.id===F.editId);
    if(e){e.kg=F.kg;e.sets=F.sets;e.reps=F.reps;if(isDone(e))logSet(e);}
  }else{
    items.push({id:uid(),name:F.name,kg:F.kg,sets:F.sets,reps:F.reps,done:false});
  }
  S.last[F.name]={kg:F.kg,sets:F.sets,reps:F.reps};
  const nm=F.name;
  save();render();
  if(mode==='again'){showPick();toast(nm+' eklendi');}
  else closeSheet();
}

/* ---------- Olaylar ---------- */
document.addEventListener('click',ev=>{
  if(ev.target===$('ov')){closeSheet();return;}
  const t=ev.target.closest('button');
  if(!t)return;
  const d=t.dataset;
  if(d.day!==undefined){sel=+d.day;render();return;}
  if(t.id==='plusBtn'||d.add){showPick();return;}
  if(d.info){showInfo(d.info);return;}
  if(d.done){const e=dayList(sel).find(x=>x.id===d.done);if(e){if(isDone(e)){e.doneWeek=null;logUnset(e.name);}else{e.doneWeek=WK;logSet(e);}save();render();}return;}
  if(d.edit){const e=dayList(sel).find(x=>x.id===d.edit);if(e)showForm({editId:e.id,name:e.name,kg:e.kg,sets:e.sets,reps:e.reps});return;}
  if(d.clear){dayList(sel).forEach(e=>e.doneWeek=null);save();render();return;}
  if(d.hist){showProg(d.hist,null,d.pr||'all');return;}
  if(d.prange){progRange=d.prange;showProg(progName,progMetric);return;}
  if(d.stats){showStats();return;}
  if(d.stab){statTab=d.stab;showStats();return;}
  if(d.srange){statRange=d.srange;showStats();return;}
  if(d.cal==='open'){showCal();return;}
  if(d.calnav){calM+=+d.calnav;if(calM<0){calM=11;calY--;}else if(calM>11){calM=0;calY++;}renderCal(true);return;}
  if(d.calday){calSel=d.calday;renderCal(true,true);return;}
  if(d.caladd){bfDate=calSel;showPick();return;}
  if(d.calplan){const wi=(pd(calSel).getDay()+6)%7;const Lp=dayList(wi);Lp.forEach(e=>logAt(e.name,calSel,e.kg,e.sets,e.reps));save();renderCal(true);toast(Lp.length+' hareket kaydedildi');return;}
  if(d.lgdel!==undefined){const c=calItems[+d.lgdel];if(c){S.log[c.n].splice(c.i,1);save();renderCal(true);}return;}
  if(d.bwsave){
    let date,raw;
    if(d.ctx==='cal'){date=calSel;raw=$('bw').value;}else{date=$('bwd').value;raw=$('bwk').value;}
    const v=parseFloat(String(raw).replace(',','.'));
    if(!date||!isFinite(v)||v<20||v>400){toast('Geçerli bir kilo gir');return;}
    S.bw=S.bw.filter(x=>x.d!==date);S.bw.push({d:date,kg:Math.round(v*10)/10});S.bw.sort((p,q)=>p.d<q.d?-1:1);save();
    if(d.ctx==='cal')renderCal(true);else showStats();
    toast('Kilo kaydedildi');return;
  }
  if(d.bwdel){S.bw=S.bw.filter(x=>x.d!==d.bwdel);save();if(d.ctx==='cal')renderCal(true);else showStats();return;}
  if(d.metric){showProg(progName,d.metric);return;}
  if(d.ld!==undefined){const a=S.log[progName]||[];a.splice(+d.ld,1);save();showProg(progName,progMetric);return;}
  if(d.bk==='open'){showBackup();return;}
  if(d.bk==='export'){const ta=$('bk');ta.value=JSON.stringify(S);ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}toast(ok?'Yedek kopyalandı':'Metni seçip kopyala');return;}
  if(d.bk==='import'){importBackup(t);return;}
  if(d.close){if(bfDate){const x=bfDate;bfDate=null;showCal(x);}else closeSheet();return;}
  if(d.cat){pickCat=d.cat;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.cat===pickCat));renderPick();return;}
  if(d.pick){const l=S.last[d.pick];showForm({name:d.pick,kg:l?l.kg:0,sets:l?l.sets:3,reps:l?l.reps:10});return;}
  if(d.new){
    const n=d.new;
    if(!allNames().some(x=>norm(x.n)===norm(n))){S.custom.push(n);save();}
    const l=S.last[n];showForm({name:n,kg:l?l.kg:0,sets:l?l.sets:3,reps:l?l.reps:10});return;
  }
  if(d.backpick){showPick();return;}
  if(d.step){
    const [k,v]=d.step.split(':');const el=$('f_'+k);
    let cur=parseFloat(String(el.value).replace(',','.'));if(!isFinite(cur))cur=0;
    cur=Math.max(k==='kg'?0:1,cur+parseFloat(v));
    el.value=fmt(Math.round(cur*100)/100);return;
  }
  if(d.save){commit(d.save);return;}
  if(d.del){
    const items=dayList(sel);const i=items.findIndex(x=>x.id===F.editId);
    if(i>-1){items.splice(i,1);save();render();}
    closeSheet();return;
  }
});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){pickQ=ev.target.value;renderPick();}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();});

/* ---------- Sürükleyerek sıralama ---------- */
let drag=null;
document.addEventListener('contextmenu',ev=>{if(ev.target.closest('.grip'))ev.preventDefault();});
document.addEventListener('pointerdown',ev=>{
  const g=ev.target.closest('.grip');if(!g||drag)return;
  const row=g.closest('.ex');const rows=[...document.querySelectorAll('#list .ex')];
  const from=rows.indexOf(row);if(from<0)return;
  ev.preventDefault();
  const rects=rows.map(r=>{const b=r.getBoundingClientRect();return{top:b.top+window.scrollY,h:b.height};});
  drag={row,rows,rects,from,to:from,startY:ev.clientY,y:ev.clientY,sy:window.scrollY,raf:0};
  rows.forEach(r=>{if(r!==row)r.classList.add('shift');});
  row.classList.add('dragging');
  document.body.style.userSelect='none';
  try{g.setPointerCapture(ev.pointerId);}catch(e){}
  dragTick();
});
function dragUpdate(){
  const d=drag;if(!d)return;
  const dy=(d.y-d.startY)+(window.scrollY-d.sy);
  d.row.style.transform=`translateY(${dy}px)`;
  const me=d.rects[d.from];const center=me.top+me.h/2+dy;
  let to=0;d.rects.forEach((r,i)=>{if(i!==d.from&&r.top+r.h/2<center)to++;});
  d.to=to;const shift=me.h+10;
  d.rows.forEach((r,i)=>{
    if(i===d.from)return;let t=0;
    if(d.from<to&&i>d.from&&i<=to)t=-shift;
    else if(d.from>to&&i>=to&&i<d.from)t=shift;
    r.style.transform=t?`translateY(${t}px)`:'';
  });
}
function dragTick(){
  if(!drag)return;
  if(drag.y<90)window.scrollBy(0,-10);else if(drag.y>window.innerHeight-90)window.scrollBy(0,10);
  dragUpdate();drag.raf=requestAnimationFrame(dragTick);
}
document.addEventListener('pointermove',ev=>{if(drag){drag.y=ev.clientY;ev.preventDefault();}},{passive:false});
function endDrag(cancel){
  const d=drag;if(!d)return;
  cancelAnimationFrame(d.raf);drag=null;document.body.style.userSelect='';
  if(!cancel&&d.to!==d.from){const arr=dayList(sel);const m=arr.splice(d.from,1)[0];arr.splice(d.to,0,m);save();}
  render();
}
document.addEventListener('pointerup',()=>endDrag(false));
document.addEventListener('pointercancel',()=>endDrag(true));

let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

render();
</script>
