name: APK olustur

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor kur
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Android projesini olustur
        run: npx cap add android

      - name: Adim sayaci ve izinleri ekle
        run: |
          mkdir -p android/app/src/main/java/com/antrenman/cizelge
          cp native/*.java android/app/src/main/java/com/antrenman/cizelge/
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml
          echo "--- Manifest ---"
          cat android/app/src/main/AndroidManifest.xml
          echo "--- Java dosyalari ---"
          ls android/app/src/main/java/com/antrenman/cizelge/

      - name: Web dosyalarini esitle
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: antrenman-cizelgem-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
